<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Scramble Word Search</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --found: #22c55e;
            --selected: #3b82f6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .container {
            max-width: 1050px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        header {
            text-align: center;
            width: 100%;
        }
        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        header p {
            color: var(--text-light);
            font-size: 1rem;
        }
        .timer-banner {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color .2s;
            width: 100%;
            max-width: 900px;
        }
        .timer-banner.flash {
            background-color: #ef4444;
            color: #fff;
        }
        .ad-space {
            background: #e2e8f0;
            border: 2px dashed #cbd5e1;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-radius: 8px;
            width: 100%;
        }
        .ad-top {
            max-width: 900px;
            height: 90px;
        }
        .ad-sidebar {
            height: auto;
            min-height: 120px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        @media (min-width: 768px) {
            .main-layout {
                grid-template-columns: 1.1fr 1fr;
                align-items: start;
            }
        }
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1);
            touch-action: none;
            width: 100%;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            user-select: none;
            touch-action: none;
        }
        .cell {
            aspect-ratio: 1;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1.05rem;
            border-radius: 4px;
            cursor: pointer;
            touch-action: none;
            transition: background-color 0.1s ease;
        }
        .cell.selected {
            background: var(--selected);
            color: #fff;
        }
        .cell.found {
            background: var(--found);
            color: #fff;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            height: 100%;
        }
        .word-list-box {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .word-list-box h3 {
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
            text-align: center;
            font-size: 1.2rem;
            color: var(--primary);
        }
        .word-bank-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            align-content: start;
        }
        .word-item {
            padding: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            background: #f8fafc;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            border: 1px solid #e2e8f0;
        }
        .word-item.completed {
            text-decoration: line-through;
            color: var(--found);
            background: #f0fdf4;
            border-color: #bbf7d0;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ad-space ad-top">Advertisement</div>
        
        <header>
            <h1>Scramble Word Search</h1>
            <p>Swipe or drag to find words! Leftover letters shuffle every 30 seconds.</p>
        </header>
        
        <div class="timer-banner" id="timer-box">⏳ Shuffling in: <span id="countdown">00:30</span></div>
        
        <div class="main-layout">
            <main class="game-area">
                <div class="grid" id="grid"></div>
            </main>
            
            <aside class="sidebar">
                <div class="word-list-box">
                    <h3>Target Words</h3>
                    <div class="word-bank-grid" id="word-list"></div>
                </div>
                <div class="ad-space ad-sidebar">Advertisement</div>
            </aside>
        </div>
    </div>

    <script>
        const DICTIONARY=[
            ["APPLE","BANANA","CHERRY","ORANGE","GRAPE","LEMONS","MANGO","PEACHY","MELONS","BERRY","PAPAYA","TOMATO","RADISH","POTATO","CELERY","CARROT"],
            ["COWBOY","ROCKET","WIZARD","NINJAS","PIRATE","ROBOTS","KNIGHT","DRAGON","ALIENS","HEROES","GOBLIN","CYBORG","PUPPET","BEASTS","CLONES","MUTANT"],
            ["COPPER","BRONZE","SILVER","CHROME","QUARTZ","TIMBER","MARBLE","GRAVEL","CEMENT","GRANITE","NICKEL","SULFUR","BASALT","COBBLE","PUMICE","ZINCITE"],
            ["WINTER","SUMMER","AUTUMN","SPRING","BREEZY","FREEZE","CHILLY","STORMS","CLOUDY","SUNNY","WARMTH","SHOWER","BREEZES","THUNDER","LIGHTS","FOGGYY"],
            ["GUITAR","VIOLIN","DRUMMER","PIANOS","FLUTES","TRUMPET","SINGERS","CHORUS","RHYTHMS","LYRICS","BANJOS","CELLOE","SOUNDS","CHORDS","SONNET","OPERAS"]
        ];
        let activeWords=[],foundWords=[],foundCellCoordinates=new Set();
        const GRID_SIZE=12;
        let countdownInterval,timeLeft=30,gameActive=!0,isDragging=!1,startCell=null,currentSelection=[],matrix=[];
        
        function initGame(){
            activeWords=[...DICTIONARY[Math.floor(Math.random()*DICTIONARY.length)]];
            foundWords=[];
            foundCellCoordinates.clear();
            gameActive=!0;
            generatePuzzle(!0);
            resetTimer();
        }
        
        function resetTimer(){
            clearInterval(countdownInterval);
            timeLeft=30;
            document.getElementById("countdown").textContent="00:30";
            countdownInterval=setInterval(()=>{
                if(gameActive){
                    timeLeft--;
                    document.getElementById("countdown").textContent=`00:${timeLeft.toString().padStart(2,"0")}`;
                    if(timeLeft<=0) silentShuffle();
                }
            },1e3);
        }
        
        function silentShuffle(){
            if(!gameActive)return;
            const e=document.getElementById("timer-box");
            e.classList.add("flash");
            setTimeout(()=>e.classList.remove("flash"),300);
            generatePuzzle(!1);
            timeLeft=30;
        }
        
        function generatePuzzle(e){
            const t=activeWords.filter(e=>!foundWords.includes(e));
            let n=Array(GRID_SIZE).fill(null).map(()=>Array(GRID_SIZE).fill(""));
            if(!e){
                for(let e=0;e<GRID_SIZE;e++){
                    for(let t=0;t<GRID_SIZE;t++){
                        if(foundCellCoordinates.has(`${e},${t}`)) n[e][t]=matrix[e][t];
                    }
                }
            }
            t.forEach(e=>{
                let t=!1,l=0;
                const r=[,,,[1,-1],[0,-1],[-1,0],[-1,-1],[-1,1]];
                while(!t&&l<250){
                    l++;
                    let o=r[Math.floor(Math.random()*r.length)],i=Math.floor(Math.random()*GRID_SIZE),s=Math.floor(Math.random()*GRID_SIZE),a=i+o*(e.length-1),c=s+o*(e.length-1);
                    if(a>=0&&a<GRID_SIZE&&c>=0&&c<GRID_SIZE){
                        let l=!0;
                        for(let t=0;t<e.length;t++){
                            let r=i+o*t,c=s+o*t;
                            if(""!==n[r][c]&&n[r][c]!==e[t]) l=!1;
                        }
                        if(l){
                            for(let t=0;t<e.length;t++) n[i+o*t][s+o*t]=e[t];
                            t=!0;
                        }
                    }
                }
            });
            const l="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for(let e=0;e<GRID_SIZE;e++){
                for(let t=0;t<GRID_SIZE;t++){
                    if(""===n[e][t]) n[e][t]=l[Math.floor(Math.random()*l.length)];
                }
            }
            matrix=n;
            renderUi();
        }
        
        function renderUi(){
            const e=document.getElementById("grid");
            e.innerHTML="";
            for(let t=0;t<GRID_SIZE;t++){
                for(let n=0;n<GRID_SIZE;n++){
                    const l=document.createElement("div");
                    l.classList.add("cell");
                    l.textContent=matrix[t][n];
                    l.dataset.row=t;
                    l.dataset.col=n;
                    if(foundCellCoordinates.has(`${t},${n}`)) l.classList.add("found");
                    l.addEventListener("mousedown",e=>startSelect(l));
                    l.addEventListener("mouseenter",()=>trackSelect(l));
                    l.addEventListener("touchstart",e=>{e.preventDefault();startSelect(l)});
                    e.appendChild(l);
                }
            }
            if(!window.dragBound){
                window.addEventListener("mouseup",endSelect);
                window.addEventListener("touchend",endSelect);
                window.addEventListener("touchmove",handleTouchMove,{passive:!1});
                window.dragBound=!0;
            }
            const t=document.getElementById("word-list");
            t.innerHTML="";
            activeWords.forEach(e=>{
                const n=document.createElement("div");
                n.classList.add("word-item");
                n.textContent=e;
                if(foundWords.includes(e)) n.classList.add("completed");
                t.appendChild(n);
            });
        }
        
        function handleTouchMove(e){
            if(!isDragging||!gameActive)return;
            let t=e.touches,n=document.elementFromPoint(t.clientX,t.clientY);
            if(n&&n.classList.contains("cell")) trackSelect(n);
        }
        
        function startSelect(e){
            if(gameActive){
                isDragging=!0;
                startCell=e;
                currentSelection=[e];
                e.classList.add("selected");
            }
        }
        
        function trackSelect(e){
            if(!isDragging||!gameActive||currentSelection.includes(e))return;
            let t=parseInt(startCell.dataset.row),n=parseInt(startCell.dataset.col),l=parseInt(e.dataset.row),r=parseInt(e.dataset.col),o=l-t,i=r-n;
            if(0===o||0===i||Math.abs(o)===Math.abs(i)){
                document.querySelectorAll(".cell.selected").forEach(e=>e.classList.remove("selected"));
                currentSelection=[];
                let s=Math.max(Math.abs(o),Math.abs(i)),a=0===o?0:o/s,c=0===i?0:i/s;
                for(let e=0;e<=s;e++){
                    let o=t+a*e,i=n+c*e,s=document.querySelector(`[data-row='${o}'][data-col='${i}']`);
                    if(s){
                        s.classList.add("selected");
                        currentSelection.push(s);
                    }
                }
            }
        }
        
        function endSelect(){
            if(!isDragging||!gameActive)return;
            isDragging=!1;
            let e=currentSelection.map(e=>e.textContent).join(""),t=e.split("").reverse().join("");
            activeWords.forEach(n=>{
                if(!foundWords.includes(n)&&(e===n||t===n)){
                    foundWords.push(n);
                    currentSelection.forEach(e=>{foundCellCoordinates.add(`${e.dataset.row},${e.dataset.col}`)});
                }
            });
            document.querySelectorAll(".cell.selected").forEach(e=>e.classList.remove("selected"));
            currentSelection=[];
            renderUi();
            if(foundWords.length===activeWords.length){
                gameActive=!1;
                clearInterval(countdownInterval);
                setTimeout(()=>{
                    alert("Congratulations! You have found all of the words.");
                    timeLeft=5;
                    document.getElementById("countdown").textContent="Next puzzle in 5s";
                    let e=setInterval(()=>{
                        timeLeft--;
                        if(timeLeft>0){
                            document.getElementById("countdown").textContent=`Next puzzle in ${timeLeft}s`;
                        } else {
                            clearInterval(e);
                            initGame();
                        }
                    },1e3);
                },200);
            }
        }
        initGame();
    </script>
</body>
</html>
