/* SHIFT EXPERIENCE v2 — deliberate demonstration, not a two-second trailer */
.practice-hero{border:1px solid #74eaff;border-radius:22px;background:linear-gradient(165deg,#072e53ed,#07152fdc);padding:13px 12px;margin:12px 0;box-shadow:inset 0 1px 11px #1bddff27,0 0 22px #176a862b}
.practice-hero .practice-grid{margin:14px auto 10px;max-width:340px}
.lesson-step{font-size:11px;letter-spacing:.12em;color:#98eaff;font-weight:900;text-align:center;text-transform:uppercase}
.lesson-head{font-size:19px;text-align:center;color:#fff2af;font-weight:1000;margin:6px 0;line-height:1.22;text-shadow:0 0 15px #ff9c3766}
.lesson-explain{text-align:center;font-size:13px;color:#eaf9ff;line-height:1.55;margin:6px auto 9px;max-width:330px}
.lesson-words{display:flex;justify-content:center;gap:7px;margin:7px 0 0}
.lesson-word{border:1px solid #55d7ff;background:#082443;padding:6px 12px;border-radius:99px;font-weight:950;font-size:12px;letter-spacing:.08em}
.lesson-word.locked{color:#ccffcb;border-color:#87ff93;background:#0c5139;box-shadow:0 0 14px #36fa89a9}
.lesson-word.newfound{color:#ffe8a3;border-color:#fbc935;background:#604118;box-shadow:0 0 14px #ffc83e9e}
.lesson-counter{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;border:1px solid #2be7fa;border-radius:15px;padding:8px 4px;margin:10px auto;max-width:350px;text-align:center;background:#071d3d}
.lesson-counter>div+div{border-left:1px solid #246c90}.lesson-counter small{display:block;color:#74dffe;font-size:9px;letter-spacing:.09em;font-weight:950}.lesson-counter strong{color:#eaff8d;font-size:16px;font-variant-numeric:tabular-nums}
.lesson-counter .countdown strong{font-size:22px;color:#ffd84a;text-shadow:0 0 9px #ffa115}
.lesson-counter .countdown.urgent strong{color:#ff7a8e}
.lesson-banner{padding:9px 10px;background:#0a3546;border:1px solid #35cfff;border-radius:13px;color:#effaff;font-size:12px;line-height:1.45;text-align:center;min-height:48px}
.lesson-banner.success{background:#0a422c;border-color:#83fb95;color:#deffe3}
.lesson-banner.reward{background:#423016;border-color:#ffd05c;color:#fff0bc}
.practice-tile:not(:disabled){transition:transform .12s, box-shadow .12s}
.practice-tile:not(:disabled):active{transform:scale(.95)}
.practice-tile.found{color:#053b2b;border-color:#e4ff84;box-shadow:0 0 18px #39ff84bd,inset 0 7px 9px #dcfffd7c}
.practice-tile.second-found{border-color:#ffec85;background:radial-gradient(circle at 35% 20%,#fff6ba,#ffc43a 52%,#bd4d18 90%);color:#473100;box-shadow:0 0 17px #ffc23aa8}
.practice-grid.shifted{animation:board-breathe .6s ease-out}
@keyframes board-breathe{0%{filter:brightness(1.75);transform:scale(.975)}100%{filter:brightness(1);transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.practice-grid.shifted{animation:none}.practice-tile{transition:none!important}}
@media(max-width:360px){.lesson-head{font-size:17px}.lesson-explain{font-size:12px}.practice-hero{padding:10px 7px}.practice-grid{gap:6px}}

/* Tutorial-specific compact chrome: visible interaction, not a text wall above it. */
.is-shift-lesson .review-header{margin-bottom:5px}
.is-shift-lesson .toolbar{margin:0 0 5px}
.is-shift-lesson .eyebrow{margin:3px 0}
.is-shift-lesson .title{font-size:clamp(22px,6vw,27px);margin:2px 0 3px}
.is-shift-lesson .subtitle{font-size:12px;margin:4px 0 7px}
.is-shift-lesson .sparkline{margin:7px 0}
.is-shift-lesson .practice-hero{padding:9px 9px;margin:7px 0}
.is-shift-lesson .lesson-head{font-size:17px;margin:4px 0}
.is-shift-lesson .lesson-explain{font-size:12.5px;line-height:1.4;margin:4px auto 6px}
.is-shift-lesson .lesson-counter{padding:5px 3px;margin:6px auto}
.is-shift-lesson .lesson-words{margin:4px 0}
.is-shift-lesson .practice-hero .practice-grid{max-width:280px;gap:6px;margin:9px auto 7px}
.is-shift-lesson .lesson-guideline{margin:5px 0 8px}
.is-shift-lesson .actions{margin:9px 0;gap:8px}
@media(max-height:650px){.is-shift-lesson .practice-hero .practice-grid{max-width:252px;gap:5px}.is-shift-lesson .subtitle{margin-bottom:5px}}

/* SHIFT EXPERIENCE V3: real interactive swipe/tap experience and a deliberate pauseable SHIFT reveal. */
.practice-hero .practice-grid{touch-action:none;user-select:none;-webkit-user-select:none;max-width:304px;gap:7px}
.practice-grid .practice-tile{touch-action:none;min-height:0;min-width:0;cursor:pointer;user-select:none;-webkit-user-select:none}
.practice-grid .practice-tile:disabled{cursor:default}
.practice-grid .practice-tile.drag-preview{transform:scale(1.045);border-color:#fff8a7;background:radial-gradient(circle at 30% 20%,#fffbdc,#79ffcc 43%,#1078ad 91%);color:#072d56;box-shadow:0 0 14px #9fffaecc,inset 0 5px 7px #fff9;position:relative;z-index:1}
.practice-grid .practice-tile.start-of-target:not(.found):not(.second-found),.practice-grid .practice-tile.end-of-target:not(.found):not(.second-found){border-color:#ffe47d;box-shadow:0 0 14px #ffe26777,inset 0 8px 10px #d7fcff88}
.practice-grid .practice-tile.start{outline:3px solid #fffdd1;outline-offset:2px;box-shadow:0 0 18px #fdff9c,0 0 9px #fff,inset 0 5px 7px #fff9}
.lesson-guideline{font-size:12px;color:#b2efff;text-align:center;margin:7px 0 10px;font-weight:750}
.lesson-before-after{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px;font-size:11px;color:#e9faff}
.lesson-before-after>span{border:1px solid #75d8ec80;background:#062f53;border-radius:10px;padding:7px 9px}
.lesson-before-after>span:last-child{color:#b8ffd3;border-color:#4df3af}
.lesson-state-badge{display:block;text-align:center;font-size:12px;margin-top:8px;color:#fff5a3;font-weight:900}
.shift-meter{height:9px;background:#09274b;border:1px solid #5ee7fa;border-radius:999px;overflow:hidden;margin:10px 1px}
.shift-meter>div{height:100%;background:linear-gradient(90deg,#37ffe0,#a4ed41,#ffc82e);transition:width .14s linear;box-shadow:0 0 10px #a7ff61}
.practice-hero .lesson-explain{max-width:370px;font-size:13.5px}
@media(max-width:350px){.practice-hero .practice-grid{max-width:260px}.practice-grid .practice-tile{font-size:21px}.lesson-guideline{font-size:11px}}
@media(prefers-reduced-motion:reduce){.practice-grid .practice-tile.drag-preview{transition:none}.shift-meter>div{transition:none}}

 const title={find:'YOUR FIRST DISCOVERY',locked:'FOUND WORDS STAY LOCKED',countdown:'WATCH THE SHIFT CLOCK',shifted:'THE OTHER WORD MOVED!',mastered:'NOW YOU KNOW WHAT SHIFT IT! IS'}[phase];

 const beforeMode=state.demoReturn==='ready',fromGuide=state.demoReturn==='guide';
 let mainAction='';

 else if(phase==='countdown')mainAction=btn(state.demoPaused?'▶ RESUME COUNTDOWN':'⏸ PAUSE & LOOK','demo-pause','ghost');
 else if(phase==='mastered')mainAction=btn(beforeMode?'START MY CHOSEN PUZZLE ▶':fromGuide?'RETURN TO GAME GUIDE':'CHOOSE MY CHALLENGE','demo-next','gold');
 const secondary=btn(beforeMode?'SKIP LESSON · PLAY '+safe(state.mode):fromGuide?'BACK TO GAME GUIDE':'SKIP LESSON · CHOOSE MODE','demo-next','ghost small');

 })).join('');

}

const sampleRows=['NOTEBD','FLUTEX','PRIANO','TGLQWA','MUSICR','SINGEK'];
function screenGame(){const mode=state.mode||'ZEN';let rows=sampleRows.map((r,i)=>r.split('').map((ch,j)=>{if(state.sampleShift&&i>0)ch=String.fromCharCode(65+((i*7+j*11)%26));return `<span class="${state.sampleFound&&i===0&&j<4?'found':''}">${ch}</span>`}).join('')).join('');return `${toolbar('FIRST PUZZLE GUIDANCE','home','EXAMPLE')}<div class="eyebrow">DEMONSTRATION · NOT THE LIVE GAME</div><h1 class="title">${mode} · LEVEL ${state.level}</h1><div class="hud"><div><small>TIME</small><strong>${mode==='ZEN'?'ZEN':'RUNNING'}</strong></div><div><small>SHIFT</small><strong class="pink">00:06</strong></div><div><small>FOUND</small><strong>${state.sampleFound?'1':'0'} / 5</strong></div></div><div class="panel" style="padding:10px 9px"><div class="section-label" style="text-align:center;color:#fff">MUSIC ROOM</div><div class="word-list">${['NOTE','FLUTE','PIANO','MELODY','SINGER'].map(x=>`<span class="${state.sampleFound&&x==='NOTE'?'done':''}">${x}</span>`).join('')}</div></div><div class="small-tiles">${rows}</div><div class="context-actions">${btn('💡 HINT','hint','small')}${btn('❄ FREEZE','freeze','small')}${btn('🎨 THEMES','themes','small')}</div><div class="panel"><div class="section-label">CONTEXTUAL HELP — ONLY WHEN NEEDED</div><p class="copy" style="margin:8px 0">${safe(state.notice||'Found words stay locked. Remaining letters shift automatically. Tap a tool to see how we would explain it, without spending coins.')}</p></div><div class="actions">${!state.sampleFound?btn('DEMO ACTION: FIND NOTE','find-note','small'):btn('DEMO ACTION: WATCH SHIFT','shift','small')}${btn('SIMULATE FIRST LEVEL CLEARED','victory','gold')}${btn('OPEN GAME GUIDE','guide','ghost small')}</div><p class="preview-only">Illustrative board only · not an actual solvable campaign puzzle.</p>`}
function screenVictory(){return `${toolbar('FIRST VICTORY','game')}<div class="victory"><div class="eyebrow">FIRST ACHIEVEMENT</div><h1>LEVEL CLEARED!</h1><div class="medal"><div><strong>${state.level}</strong><br><small>LEVEL</small></div></div><div class="panel gold"><div style="font-size:21px;font-weight:1000">+10 EARNED COINS</div><div class="tiny" style="margin:5px 0 0">Campaign example · no simulated coins added to real saves</div></div><div class="panel"><div class="section-label">WHAT'S NEXT?</div><p class="copy" style="margin:7px 0">Keep going, or explore themes, Daily puzzles, and your records when you're ready.</p></div><div class="actions">${btn('NEXT LEVEL ▶','next-level','gold')}${btn('EXPLORE THE GAME','guide','ghost small')}${btn('HOME','home','ghost small')}</div></div>`}
const guideData={shift:{title:'AUTOMATIC SHIFT',body:'Shift It! moves the remaining unfound letters when the SHIFT countdown reaches zero. You do not press a SHIFT button. Completed words remain highlighted and locked.',tip:'This is the defining twist. Players should understand it before or during the first puzzle.'},modes:{title:'FOUR PLAY MODES',body:'Zen is untimed. Classic adds a timer and steady SHIFT. Extreme raises the intensity. Master has an 8×8 board with 7–8 target words across all directions.',tip:'All modes should be accessible without having to finish Zen first.'},tools:{title:'HINT & FREEZE',body:'HINT costs 10 earned coins and helps locate a word. FREEZE costs 20 earned coins and temporarily pauses SHIFT. Both tools should explain what they do before a first purchase.',tip:'Spending a coin is never required to learn how a tool works.'},daily:{title:'DAILY CHALLENGE',body:'A new date-based puzzle is available each day. It changes at the player’s local midnight. The first Daily win of the day has an extra coin bonus under the current rules.',tip:'Daily stays accessible from Home, but needs no mandatory explanation before the first campaign puzzle.'},progress:{title:'PROGRESS & REPLAY',body:'Each difficulty tracks its own campaign levels. Personal Bests shows records, and LEVELS lets you practice previously completed levels without changing campaign progress.',tip:'Introduce this after the player earns a first result.'},custom:{title:'APPEARANCE & SOUND',body:'Players may use the traditional paper-like Classic theme or neon and scenic themes. AUTO cycles available appearances. Sound settings can be adjusted whenever desired.',tip:'Do not force appearance customization before first play.'}};
function screenGuide(){return `${toolbar('ON-DEMAND HELP',state.guideReturn||'home')}<h1 class="title">GAME GUIDE</h1><p class="subtitle">Six short answers. Open them whenever you want—never a required lecture.</p><div class="guide-tabs" role="tablist">${Object.entries({shift:'SHIFT',modes:'MODES',tools:'TOOLS',daily:'DAILY',progress:'PROGRESS',custom:'CUSTOMIZE'}).map(([key,label])=>`<button role="tab" aria-selected="${state.guideTab===key}" data-action="tab-${key}">${label}</button>`).join('')}</div><div class="panel guide-body"><div class="eyebrow">${guideData[state.guideTab].title}</div><p class="copy">${guideData[state.guideTab].body}</p><div class="explainer">${guideData[state.guideTab].tip}</div></div><div class="actions">${btn('RETURN TO WHERE I WAS','back-guide','gold')}${btn('REPLAY THE SHIFT EXPERIENCE','demo-from-guide','ghost small')}</div>`}
function screenSettings(){return `${toolbar('OPTIONAL PREFERENCES','home')}<h1 class="title">PERSONALIZE</h1><p class="subtitle">Settings should always be reachable, but they should never delay the first puzzle.</p><div class="panel"><label for="setting-theme">Your preferred board look</label><select id="setting-theme" style="width:100%;margin:9px 0;padding:10px;background:#093056;border:1px solid #3cd5fa;border-radius:9px;color:#fff"><option>Aurora Nights</option><option>Classic Word Search</option><option>AUTO</option></select><label class="check"><input type="checkbox" id="sound-choice" ${state.sound?'checked':''}> Sound effects enabled</label><p class="tiny">This prototype does not write to your actual game saves.</p></div><div class="actions">${btn('CHOOSE DIFFICULTY','modes','small')}${btn('DONE','home','gold')}</div>`}
function render(){const remember=state.screen==='demo'?window.scrollY:0;document.body.classList.toggle('is-shift-lesson',state.screen==='demo');let screens={home:screenHome,modes:screenMode,ready:screenReady,demo:screenDemo,game:screenGame,victory:screenVictory,guide:screenGuide,settings:screenSettings};app.innerHTML=screens[state.screen]();document.title='Shift It! FTUE Prototype — '+state.screen.toUpperCase();let theme=document.querySelector('#theme-select, #setting-theme');if(theme)theme.value=state.theme;window.scrollTo(0,remember)}
function go(screen){if(screen!=='demo')stopDemoTimer();window.scrollTo(0,0);state.screen=screen;render()}
function stopDemoTimer(){if(state.demoTimer){clearInterval(state.demoTimer);clearTimeout(state.demoTimer);state.demoTimer=null}}
function startDemo(){
 stopDemoTimer();state.demoPhase='find';state.demoCountdown=8;state.demoPaused=false;
 state.lessonEndpointStart=null;state.demoSecondStart=false;state.tutorialStart=false;state.tutorialDone=false;state.tutorialShift=false;
 go('demo');
}
function startCountdown(){
 if(state.demoPhase!=='locked')return;
 stopDemoTimer();state.demoPhase='countdown';state.demoCountdown=8;state.demoPaused=false;render();
 state.demoTimer=setInterval(()=>{
   if(state.screen!=='demo'||state.demoPhase!=='countdown'){stopDemoTimer();return}
   if(state.demoPaused)return;
   state.demoCountdown=Math.max(0,state.demoCountdown-1);
   const counter=app.querySelector('#lesson-clock'),meter=app.querySelector('#shift-meter-fill');
   if(counter)counter.textContent='00:'+String(state.demoCountdown).padStart(2,'0');
   if(meter)meter.style.width=(state.demoCountdown/8*100)+'%';
   if(counter)counter.closest('.countdown')?.classList.toggle('urgent',state.demoCountdown<=3);
   if(state.demoCountdown===0){stopDemoTimer();state.demoPhase='shifted';state.lessonEndpointStart=null;render()}
 },1000);
}
function toggleCountdownPause(){if(state.demoPhase!=='countdown')return;state.demoPaused=!state.demoPaused;render()}
function completeLessonWord(){
 if(state.demoPhase==='find'){state.demoPhase='locked';state.tutorialDone=true}
 else if(state.demoPhase==='shifted'){state.demoPhase='mastered';state.demoSecondStart=false}
 else return;
 state.lessonEndpointStart=null;render();
}
function selectLessonTile(r,c){
 if(state.screen!=='demo')return;
 const active=state.demoPhase==='find'||state.demoPhase==='shifted';if(!active)return;
 const row=state.demoPhase==='find'?0:2;
 if(r!==row||c!==0&&c!==3){const banner=app.querySelector('#lesson-status');if(banner)banner.textContent='Start at either end of '+(state.demoPhase==='find'?'WAVE':'STAR')+' (the first or last letter).';return}
 if(state.lessonEndpointStart===null){state.lessonEndpointStart=c;render();return}
 if(state.lessonEndpointStart!==c){completeLessonWord();return}
 state.lessonEndpointStart=null;render();
}
// Pointer path uses screen coordinates to handle mouse dragging and touch-screen implicit pointer capture.
// Keeping all tiles enabled allows swiping through intermediate letters rather than only tapping endpoints.
let activeLessonDrag=null;
function lessonTileFromPoint(x,y){let node=document.elementFromPoint(x,y)?.closest('.practice-tile');if(!node||!app.contains(node))return null;return {node,r:Number(node.dataset.row),c:Number(node.dataset.col)}}
function clearLessonDragVisual(){app.querySelectorAll('.practice-tile.drag-preview').forEach(e=>e.classList.remove('drag-preview'))}
function updateLessonDragVisual(endCol){
 clearLessonDragVisual();if(!activeLessonDrag)return;
 const r=activeLessonDrag.r,from=activeLessonDrag.c,to=endCol;
 app.querySelectorAll('.practice-tile').forEach(t=>{
  if(Number(t.dataset.row)===r&&Number(t.dataset.col)>=Math.min(from,to)&&Number(t.dataset.col)<=Math.max(from,to))t.classList.add('drag-preview');
 });
}
app.addEventListener('pointerdown',ev=>{
 if(state.screen!=='demo'||!['find','shifted'].includes(state.demoPhase))return;
 const el=ev.target.closest('.practice-tile');if(!el)return;
 const r=Number(el.dataset.row),c=Number(el.dataset.col),expected=state.demoPhase==='find'?0:2;
 if(r!==expected||(c!==0&&c!==3))return;
 activeLessonDrag={id:ev.pointerId,r,c,initialX:ev.clientX,initialY:ev.clientY,endC:c,moved:false};
});
app.addEventListener('pointermove',ev=>{
 if(!activeLessonDrag||ev.pointerId!==activeLessonDrag.id)return;
 const under=lessonTileFromPoint(ev.clientX,ev.clientY);
 if(!under||under.r!==activeLessonDrag.r)return;
 activeLessonDrag.endC=under.c;
 if(Math.abs(ev.clientX-activeLessonDrag.initialX)+Math.abs(ev.clientY-activeLessonDrag.initialY)>7)activeLessonDrag.moved=true;
 if(activeLessonDrag.moved)updateLessonDragVisual(under.c);
});
app.addEventListener('pointerup',ev=>{
 if(!activeLessonDrag||ev.pointerId!==activeLessonDrag.id)return;
 const current=activeLessonDrag;activeLessonDrag=null;
 clearLessonDragVisual();
 const under=lessonTileFromPoint(ev.clientX,ev.clientY);
 if(current.moved&&under&&under.r===current.r&&under.c===3-current.c){
   completeLessonWord();
   // The browser may dispatch a click after the pointer sequence. No click handler must alter the new stage.
   ignoreLessonClickUntil=Date.now()+350;
 }else if(current.moved){
   const banner=app.querySelector('#lesson-status');if(banner)banner.textContent='Good start. Drag all the way to the opposite end of the word, or tap its two endpoints.';
   ignoreLessonClickUntil=Date.now()+350;
 }
});
app.addEventListener('pointercancel',()=>{activeLessonDrag=null;clearLessonDragVisual()});
let ignoreLessonClickUntil=0;
function setMode(mode){state.mode=mode;go('ready')}
function startGame(){clearTimeout(state.demoTimer);state.notice='';state.sampleFound=false;state.sampleShift=false;go('game')}
function showGuide(tab){state.guideReturn=state.screen;state.guideTab=tab||'shift';go('guide')}
function act(key){switch(key){case 'play':if(state.firstVictory){state.mode=state.mode||'ZEN';startGame()}else go('modes');break;case 'home':go('home');break;case 'modes':go('modes');break;case 'ready':go('ready');break;case 'demo':state.demoReturn='ready';startDemo();break;case 'demo-next':if(state.demoReturn==='ready'&&state.mode)startGame();else if(state.demoReturn==='guide')go(state.guideReturn||'home');else go('modes');break;case 'demo-countdown':startCountdown();break;case 'demo-pause':toggleCountdownPause();break;case 'demo-again':startDemo();break;case 'start':startGame();break;case 'demo-from-home':state.demoReturn='modes';startDemo();break;case 'demo-from-modes':state.demoReturn='modes';startDemo();break;case 'demo-from-guide':state.demoReturn='guide';startDemo();break;case 'guide':showGuide('shift');break;case 'guide-daily':showGuide('daily');break;case 'settings':go('settings');break;case 'themes':showGuide('custom');break;case 'hint':state.notice='HINT: 10 earned coins to reveal a useful starting letter. This preview does not charge coins.';render();break;case 'freeze':state.notice='FREEZE: 20 earned coins to temporarily stop automatic SHIFT. This preview does not charge coins.';render();break;case 'find-note':state.sampleFound=true;state.notice='NOTE stays highlighted. The found-word record stays visible.';render();break;case 'shift':state.sampleShift=true;state.notice='Unfound letters changed automatically. NOTE stays locked.';render();break;case 'victory':state.firstVictory=true;go('victory');break;case 'next-level':state.level++;startGame();break;case 'back-guide':go(state.guideReturn||'home');break;case 'reset':stopDemoTimer();Object.assign(state,{screen:'home',mode:null,persona:null,tutorialStep:0,tutorialStart:false,tutorialDone:false,tutorialShift:false,demoPhase:"find",demoCountdown:8,demoSecondStart:false,lessonEndpointStart:null,demoPaused:false,sampleFound:false,sampleShift:false,firstVictory:false,level:1,guideTab:'shift',guideReturn:'home',demoReturn:'ready',sound:true,theme:'Aurora Nights',notice:''});go('home');break;default:
if(key.startsWith('select-'))setMode(key.slice(7));else if(key.startsWith('persona-')){state.persona=key.slice(8);state.firstVictory=false;go('modes')}else if(key.startsWith('tab-')){state.guideTab=key.slice(4);render()}else if(key.startsWith('tile-')){
 if(Date.now()<ignoreLessonClickUntil)return;
 const [r,c]=key.slice(5).split('-').map(Number);selectLessonTile(r,c);

}break;
}}
app.addEventListener('click',ev=>{const hit=ev.target.closest('button[data-action]');if(!hit)return;act(hit.dataset.action)});
app.addEventListener('change',ev=>{if(ev.target.id==='theme-select'||ev.target.id==='setting-theme')state.theme=ev.target.value;if(ev.target.id==='sound-choice')state.sound=ev.target.checked});
render();
</script>
